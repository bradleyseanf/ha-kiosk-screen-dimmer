name: Publish Screen Dimmer release
on:
  push:
    branches: [main]
    paths:
      - custom_components/ha_kiosk_screen_dimmer/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: screen-dimmer-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          node --test tests/brightness-dimmer.test.js
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Publish manifest version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/ha_kiosk_screen_dimmer/manifest.json"))["version"])')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Screen Dimmer $tag" --generate-notes --latest
          fi
